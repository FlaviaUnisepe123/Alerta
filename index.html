<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Alerta com Botão</title>
</head>
<body>

  <button onclick="mostrarMensagem()">Clique para ver o alerta</button>

  <script>
    function mostrarMensagem() {
      alert("Você clicou no botão!");
    }
  </script>

</body>
</html>
